services:
  postgres:
    image: postgres:16-alpine #(-50% menos de tamaño que la imagen estándar de postgres)
    container_name: nexora_postgres
    restart: unless-stopped # no reinicar automáticamente a menos que se detenga manualmente
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5433}:5432" # mapea el puerto 5432 del contenedor al puerto definido en .env o al 5433 por defecto
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker.entrypoint-initdb.d # Scripts de inicialización para crear tablas, insertar datos, etc.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s #tiempo de gracia antes de empezar a chequear
volumes:
  postgres_data:
    driver: local
